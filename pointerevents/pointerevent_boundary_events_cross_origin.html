<!doctype html>
<meta charset="utf-8">
<title>Pointer boundary events across cross-origin documents</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    touch-action: none;
  }
  .target {
    width: 100px;
    height: 100px;
    background: blue;
    touch-action: none;
  }
  iframe {
    width: 100px;
    height: 100px;
    border: none;
    display: block;
  }
</style>
<body>
<script>
'use strict';

const hostInfo = get_host_info();
const REMOTE_ORIGIN = hostInfo.HTTP_REMOTE_ORIGIN;
const REMOTE_ORIGIN_2 = hostInfo.HTTP_REMOTE_ORIGIN_WITH_DIFFERENT_PORT;
const CHILD_PAGE = '/pointerevents/resources/pointerevent_boundary_events_cross_origin_child.html';

let receivedMessages = [];
window.addEventListener('message', e => {
  if (e.data && e.data.type && e.data.type !== 'child-ready') {
    receivedMessages.push(e.data);
  }
});

function loadChildFrame(iframe, src, readyFrameId) {
  return new Promise(resolve => {
    function onMsg(e) {
      if (e.data && e.data.type === 'child-ready' && e.data.frameId === readyFrameId) {
        window.removeEventListener('message', onMsg);
        resolve();
      }
    }
    window.addEventListener('message', onMsg);
    iframe.src = src;
  });
}

async function waitForCondition(condition, timeoutMs = 2000) {
  const start = performance.now();
  while (!condition() && performance.now() - start < timeoutMs) {
    await new Promise(resolve => step_timeout(resolve, 20));
  }
}

promise_test(async t => {
  receivedMessages = [];
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const parentTarget = document.createElement('div');
  parentTarget.id = 'parent-target';
  parentTarget.className = 'target';
  container.appendChild(parentTarget);

  const iframe = document.createElement('iframe');
  iframe.id = 'iframe';
  container.appendChild(iframe);

  const childSrc = `${REMOTE_ORIGIN}${CHILD_PAGE}?frame_id=child&target_id=child-target`;
  await loadChildFrame(iframe, childSrc, 'child');

  let parentEvents = [];
  parentTarget.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
  });
  ['pointerout', 'pointerleave'].forEach(type => {
    parentTarget.addEventListener(type, e => {
      parentEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
    });
  });

  const rect = parentTarget.getBoundingClientRect();
  const iframeRect = iframe.getBoundingClientRect();

  await new test_driver.Actions()
    .addPointer('touchPointer1', 'touch')
    .pointerMove(Math.round(rect.left + 50), Math.round(rect.top + 50))
    .pointerDown()
    .pointerMove(Math.round(iframeRect.left + 50), Math.round(iframeRect.top + 50))
    .pointerUp()
    .send();

  await waitForCondition(() =>
    receivedMessages.some(m => m.frameId === 'child' && m.type === 'pointerenter')
  );

  const childEvents = receivedMessages.filter(m => m.frameId === 'child');

  assert_greater_than(parentEvents.length, 0, 'parent should receive boundary events');
  assert_greater_than(childEvents.length, 0, 'child should receive boundary events');

  for (const ev of parentEvents) {
    assert_equals(ev.relatedTarget, iframe, `parent ${ev.type} relatedTarget should be the iframe element`);
  }
  for (const ev of childEvents) {
    assert_true(ev.relatedTargetIsNull, `child ${ev.type} relatedTarget should be null`);
  }
}, 'Parent to iframe: relatedTarget in outer document is iframe, inner document is null');

promise_test(async t => {
  receivedMessages = [];
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const sib1 = document.createElement('iframe');
  sib1.id = 'sib1';
  container.appendChild(sib1);

  const sib2 = document.createElement('iframe');
  sib2.id = 'sib2';
  container.appendChild(sib2);

  const sib1Src = `${REMOTE_ORIGIN}${CHILD_PAGE}?frame_id=sib1&target_id=s1`;
  const sib2Src = `${REMOTE_ORIGIN_2}${CHILD_PAGE}?frame_id=sib2&target_id=s2`;

  await Promise.all([
    loadChildFrame(sib1, sib1Src, 'sib1'),
    loadChildFrame(sib2, sib2Src, 'sib2')
  ]);

  const rect1 = sib1.getBoundingClientRect();
  const rect2 = sib2.getBoundingClientRect();

  await new test_driver.Actions()
    .addPointer('touchPointer3', 'touch')
    .pointerMove(Math.round(rect1.left + 50), Math.round(rect1.top + 50))
    .pointerDown()
    .pointerMove(Math.round(rect2.left + 50), Math.round(rect2.top + 50))
    .pointerUp()
    .send();

  await waitForCondition(() =>
    receivedMessages.some(m => m.frameId === 'sib1' && m.type === 'pointerleave') &&
    receivedMessages.some(m => m.frameId === 'sib2' && m.type === 'pointerenter')
  );

  const s1Events = receivedMessages.filter(m => m.frameId === 'sib1');
  const s2Events = receivedMessages.filter(m => m.frameId === 'sib2');

  assert_greater_than(s1Events.length, 0, 'sib1 should receive boundary events');
  assert_greater_than(s2Events.length, 0, 'sib2 should receive boundary events');

  for (const ev of s1Events) {
    assert_true(ev.relatedTargetIsNull, `sib1 ${ev.type} relatedTarget should be null`);
  }
  for (const ev of s2Events) {
    assert_true(ev.relatedTargetIsNull, `sib2 ${ev.type} relatedTarget should be null`);
  }
}, 'Sibling iframes: relatedTarget is null for both documents');

promise_test(async t => {
  receivedMessages = [];
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const topTarget = document.createElement('div');
  topTarget.id = 'top-target-nested';
  topTarget.className = 'target';
  topTarget.style.background = 'cyan';
  container.appendChild(topTarget);

  const outerIframe = document.createElement('iframe');
  outerIframe.id = 'outer-iframe';
  container.appendChild(outerIframe);

  const deepSrc = `${REMOTE_ORIGIN_2}${CHILD_PAGE}?frame_id=deep&target_id=deep`;
  const outerSrc = `${REMOTE_ORIGIN}${CHILD_PAGE}?frame_id=outer&nested_parent=true&inner_src=${encodeURIComponent(deepSrc)}`;

  await loadChildFrame(outerIframe, outerSrc, 'deep');

  let topEvents = [];
  topTarget.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
  });
  ['pointerout', 'pointerleave'].forEach(type => {
    topTarget.addEventListener(type, e => {
      topEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
    });
  });

  const topRect = topTarget.getBoundingClientRect();
  const outerRect = outerIframe.getBoundingClientRect();

  await new test_driver.Actions()
    .addPointer('touchPointer4', 'touch')
    .pointerMove(Math.round(topRect.left + 50), Math.round(topRect.top + 50))
    .pointerDown()
    .pointerMove(Math.round(outerRect.left + 50), Math.round(outerRect.top + 50))
    .pointerUp()
    .send();

  await waitForCondition(() =>
    receivedMessages.some(m => m.frameId === 'deep' && m.type === 'pointerenter')
  );

  const deepEvents = receivedMessages.filter(m => m.frameId === 'deep');

  assert_greater_than(topEvents.length, 0, 'topTarget should receive boundary events');
  assert_greater_than(deepEvents.length, 0, 'deepTarget should receive boundary events');

  for (const ev of topEvents) {
    assert_equals(ev.relatedTarget, outerIframe, `topTarget ${ev.type} relatedTarget should be outerIframe`);
  }
  for (const ev of deepEvents) {
    assert_true(ev.relatedTargetIsNull, `deepTarget ${ev.type} relatedTarget should be null`);
  }
}, 'Nested iframes: relatedTarget in outer document is outermost iframe, inner document is null');
</script>
</body>
